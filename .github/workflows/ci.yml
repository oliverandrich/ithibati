name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every question about the code, defined in `gate.yml` because `release.yml` asks the same ones.
  # Caches are on here: a push to `main` is frequent and its verdict is not what ships.
  gate:
    # `./` and not the `$/` that zizmor's `self-repository` audit asks for: actionlint 1.7.12
    # rejects `$/` as a malformed `uses:`, so the two tools disagree about the same line. This is
    # the gate that decides what ships, and `./` is the form known to run — the finding is a low
    # style note, not a hole.
    uses: ./.github/workflows/gate.yml # zizmor: ignore[self-repository]

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # What zizmor's online audits need.
      actions: read
      # The repository is public, so GitHub Advanced Security is available and findings belong in
      # the security tab rather than only in pull-request annotations.
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Kept equal to `[tools]` in mise.toml by hand; see the note there.
          #
          # This job overlaps the `zizmor` step inside `mise run check` on purpose: the gate catches
          # a workflow finding before the push, and this one adds the online audits a local run
          # has no way to make, then files what it finds in the security tab.
          version: 1.30.0
          advanced-security: true
