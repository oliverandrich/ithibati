name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      # One red leg must not hide the others: which of them fail is the whole answer.
      fail-fast: false
      matrix:
        include:
          # The pinned pair, which is also what a laptop gets from mise.toml.
          - name: check
          # The floor of the `elixir` requirement in mix.exs. The pin moves by a file written
          # below; mise.toml stays the single source for a local checkout.
          - name: floor (elixir 1.17)
            elixir: "1.17"
            erlang: "27"
            # A narrower task, named in mise.toml with its reason: the full gate judges style
            # against the toolchain the tree was written with, and this leg's question is
            # compatibility.
            gate: build-and-test
          # The claim that `users_key_type: :id` is supported. Why it needs a build of its own:
          # config/config.exs.
          - name: integer account keys
            users_key_type: id
          # The claim that a consumer without Phoenix gets a core that compiles. `mix deps.get`
          # fetches optional dependencies for this project's own build, so every other leg compiles
          # with them present.
          - name: without optional deps
            without_optional: "1"

    env:
      ITHIBATI_USERS_KEY_TYPE: ${{ matrix.users_key_type }}
      ITHIBATI_WITHOUT_OPTIONAL: ${{ matrix.without_optional }}
      # Through the environment rather than straight into `run:`, which is where a workflow
      # expression becomes code. `matrix` is written in this file and not attacker-controlled, so
      # the risk here is theoretical — the habit is not.
      GATE: ${{ matrix.gate || 'check' }}

    services:
      postgres:
        # A tag, where every action below is pinned by SHA, and the difference is deliberate: an
        # action runs inside this job with its token and its workspace, while this is a database
        # the tests reach over TCP. A tag that moves breaks the run visibly; an action that moves
        # does not.
        image: postgres:18-alpine
        # No credentials in the job: config/config.exs falls back to postgres/postgres on
        # localhost:5432, which is exactly what this container offers.
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A file rather than `MISE_ELIXIR_VERSION`. The variable was set for every step of the job
      # and mise-action honoured it — it installed 1.17.3-otp-27 — but the `mise run` two steps
      # below ignored it, re-resolved mise.toml, and tried to start Elixir 1.20 on OTP 27, which
      # crashes at boot. Why that invocation ignored it is unexplained and reproduces nowhere
      # locally; a config file is honoured by both, which is the property worth depending on. It
      # also leaves the tracked pin alone.
      - name: Pin the toolchain this leg is for
        if: matrix.elixir
        env:
          ELIXIR: ${{ matrix.elixir }}
          ERLANG: ${{ matrix.erlang }}
        run: printf '[tools]\nelixir = "%s"\nerlang = "%s"\n' "$ELIXIR" "$ERLANG" > mise.local.toml

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Pinned like everything else here.
          version: 2026.9.5
          # Keyed on the toolchain rather than on the leg: three of the four install the same one
          # and should share a cache entry, and renaming a leg should not throw one away. Set
          # explicitly rather than left to the action's own key, which is computed from the config
          # files it knows about.
          cache_key_prefix: mise-${{ matrix.elixir || 'pinned' }}-${{ matrix.erlang || 'pinned' }}

      # A cold Elixir compile is otherwise the whole job. _build is only reusable under the Erlang
      # and Elixir that produced it, so the key names them directly rather than trusting that a leg
      # bumping its toolchain also renames itself. The leg is in there too, because a build under a
      # different `users_key_type` does not merely rebuild: Elixir refuses to boot at all, since
      # that setting is read with `compile_env`.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ matrix.name }}-${{ matrix.elixir || 'pinned' }}-${{ matrix.erlang || 'pinned' }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.name }}-${{ matrix.elixir || 'pinned' }}-${{ matrix.erlang || 'pinned' }}-${{ hashFiles('mise.toml') }}-

      - name: Fetch dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          # `mix deps.get` does not prune, so on the leg that drops the optional dependencies they
          # and everything they brought stay behind in mix.lock — where `deps.unlock --check-unused`
          # inside the gate finds them and fails the leg for a reason that is not the leg's point.
          # This checkout is disposable; the committed lock is untouched.
          if [ -n "$ITHIBATI_WITHOUT_OPTIONAL" ]; then mix deps.unlock --unused; fi

      - name: Run the gate
        run: mise run "$GATE"

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # What zizmor's online audits need. No `security-events: write`: the security tab needs
      # GitHub Advanced Security, which a private repository does not have, so findings arrive as
      # pull-request annotations instead.
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Kept equal to `[tools]` in mise.toml by hand; see the note there.
          #
          # This job overlaps the `zizmor` step inside `mise run check` on purpose: the gate catches
          # a workflow finding before the push, this one adds the online audits and the pull-request
          # annotations that a local run has no way to produce.
          version: 1.30.0
          advanced-security: false
          annotations: true
