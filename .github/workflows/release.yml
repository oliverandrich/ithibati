name: Release

# Only a tag, and only one shaped like a version. A branch push must never reach the job below:
# it is the one place in this repository that holds a credential able to write to hex.pm.
on:
  push:
    tags: ["v*"]

  # A dry run, because a `v*` tag here is permanent and every bug in this file has cost a version
  # number: 0.6.0 to a gate that did not ask what CI asks, 0.6.1 to a missing `mix deps.get`.
  # Dispatched from a branch, `release-check` gets as far as reading the version and then refuses
  # for want of a tag — which is the whole of what broke, proved without spending anything.
  # `publish` and `announce` are guarded to `push` below, so this can never reach the key.
  workflow_dispatch:

# Keyed on the tag, so two versions release independently — the group only ever collides with a
# re-run of the same tag. No `cancel-in-progress` for that case: cancelling half-way through
# `mix hex.publish` can leave a version number hex.pm will not let you use again.
concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  # The tag and the version, asked before anything is built: if they disagree there is nothing to
  # learn from a green suite. Its own job, because the gate below is a reusable workflow and a
  # `uses:` job cannot carry steps of its own.
  tag:
    name: tag
    runs-on: ubuntu-latest

    steps:
      # `fetch-depth: 0`, because `release-check` reads the tags: `git tag --points-at HEAD`, and
      # the `git ls-remote` comparison against it. A shallow checkout carries none.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          cache: false

      # `release-check` reads the version with `mix run`, which needs Hex and the dependencies
      # resolved. Without them Mix asks whether to install Hex, `release-check` reads the question
      # as the version, and refuses it for not being one — correctly, and eight seconds into a
      # release that has already spent its tag.
      - name: Fetch dependencies
        run: |
          mix local.hex 2.5.1 --force
          mix local.rebar --force
          mix deps.get

      - name: Check the tag against the version
        run: mise run release-check

  # The same questions a push to `main` gets, from the same file, so this gate cannot drift below
  # that one again. `hardened`, because this build's verdict is what ships: no cache is restored
  # anywhere in it.
  verify:
    # `./` and not the `$/` that zizmor's `self-repository` audit asks for: actionlint 1.7.12
    # rejects `$/` as a malformed `uses:`, so the two tools disagree about the same line. This is
    # the gate that decides what ships, and `./` is the form known to run — the finding is a low
    # style note, not a hole.
    uses: ./.github/workflows/gate.yml # zizmor: ignore[self-repository]
    needs: tag
    with:
      hardened: true

  # Split from `verify` for one reason: this is the job that can reach the key, so it is the job
  # that has to be the smallest. It declares the environment, which is what puts a human in front
  # of it, and it runs two commands.
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [tag, verify]
    # Never on a dispatch. This is the job that can reach `HEX_API_KEY`.
    if: github.event_name == 'push'

    # Configured with a required reviewer, so a tag proposes a release and a person allows it.
    # `HEX_API_KEY` is an environment secret rather than a repository one: that way no other job
    # in this repository can read it, whatever it is later asked to run.
    environment: hex

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.5
          cache: false

      - name: Fetch dependencies
        run: |
          # Pinned, unlike in `ci.yml`. This is the code that reads `HEX_API_KEY` and sends it
          # to hex.pm, and `mix local.hex --force` otherwise fetches whatever is current from
          # builds.hex.pm unverified. Kept equal to the archive a laptop has by hand.
          mix local.hex 2.5.1 --force
          mix local.rebar --force
          mix deps.get

      # Asked a second time, in the job that actually publishes. `verify` proved it about a
      # checkout of its own, and a check that does not run beside the thing it guards is a check
      # that a later edit can quietly route around.
      - name: Check the tag against the version
        run: mise run release-check

      # `mix hex.publish` sends the package and the documentation. hex.pm allows a revert for an
      # hour and not afterwards, which is why everything above this line exists.
      - name: Publish to hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

  # After hex.pm rather than beside it: a GitHub release announcing a version that failed to
  # publish would be the one artefact people find and cannot install. Its own job because it needs
  # `contents: write`, which the job holding the hex key must not have.
  announce:
    name: announce
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The changelog section is the release notes. `release-check` has already refused a tag
      # whose version has no section, so this cannot come up empty for a reason nobody has been
      # told about — but it is checked again here, because an empty release body is the kind of
      # thing that is only noticed by whoever reads the release.
      - name: Take the notes out of the changelog
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"

          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section to use as release notes."
            exit 1
          fi

          echo "--- release notes ---"
          cat release-notes.md

      - name: Create the GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$REF_NAME" --repo "$REPO" --notes-file release-notes.md
