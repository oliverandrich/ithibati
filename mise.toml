[tools]
elixir = "1.20"
erlang = "29"

# Also pinned in the `version:` input of zizmor-action in .github/workflows/ci.yml, because
# Dependabot does not read this file. The two move by hand, together.
zizmor = "1.30.0"

# No chromedriver here on purpose, though mise can install one. The version has to match the Chrome
# on *this* machine — a driver refuses a browser from another major, and Chrome updates itself
# while a tracked pin does not — so a number written here would be right for whoever added it and
# wrong for everybody else a month later. The examples' `test_helper.exs` works out which major you
# need and prints the `mise use` line; CI uses the runner's own driver through `CHROMEWEBDRIVER`.
# Keeping it out of `[tools]` also stops every unrelated CI job from downloading one.

[tasks.check]
description = "Everything that has to be green before a change is done"
# Named so that CI can run the task instead of a second copy of what it contains.
#
# `mix docs` is here rather than in `mix precommit` because ex_doc is a `dev` dependency and the
# alias runs in `test`. It earns its place: the documentation is eight cross-linked pages plus
# every moduledoc, and a reference that no longer resolves — a renamed function, a moved page — is
# a warning ExDoc prints and nobody reads. `--warnings-as-errors` is what makes it a check.
run = ["zizmor .github/", "mix precommit", "mix docs --warnings-as-errors"]

# What a CI leg runs when its question is only "does this build and behave here". Not `check`:
# that one's formatter and Credo judge style against the toolchain the tree was written with, so a
# formatter change between two Elixir releases would fail a compatibility leg for a style reason.
[tasks.build-and-test]
description = "Compile without warnings and run the tests"
run = "mix build_and_test"

# The one CI leg a normal checkout cannot reproduce: `lib/ithibati/web/` is guarded by
# `Code.ensure_loaded?`, which answers from the code path, and `_build` still holds the compiled
# Phoenix beams after any ordinary run. Named here so that CI and a laptop run the same thing rather
# than two copies of it, and so the recipe is not retyped from a comment each time.
[tasks.check-without-optional]
description = "Compile and test as a consumer without the optional Phoenix dependencies"
run = [
  "rm -rf tmp/without-optional",
  "mkdir -p tmp/without-optional",
  "rsync -a --exclude _build --exclude deps --exclude .git --exclude .beans --exclude tmp --exclude doc . tmp/without-optional/",
  "cd tmp/without-optional && ITHIBATI_WITHOUT_OPTIONAL=1 mix deps.get && ITHIBATI_WITHOUT_OPTIONAL=1 mix build_and_test",
]

# Deliberately not part of `check`; it runs on a schedule instead. Why, in
# .github/workflows/audit.yml.
[tasks.audit]
description = "Audit dependencies for advisories and retired packages"
run = ["mix deps.audit", "mix hex.audit"]

# Not `beans list --ready`, which also hides in-progress and draft. A mise task rather than a mix
# alias because `mix cmd` runs through an Erlang port instead of a pty, so beans drops its colours.
[tasks.beans]
description = "List the live backlog (everything not completed or scrapped)"
run = "beans list --no-status completed --no-status scrapped"
